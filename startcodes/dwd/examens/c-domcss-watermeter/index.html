<div id="plant-app" class="goed">
   <h2>Watermeter</h2>

   <div class="balk-achtergrond">
      <div id="water-balk"></div>
   </div>

   <p id="water-tekst">Waterstand: 40%</p>
   <p id="melding">De plant doet het goed.</p>

   <button type="button" class="actie" data-waarde="10">+10</button>
   <button type="button" class="actie" data-waarde="25">+25</button>
   <button type="button" class="actie" data-waarde="-10">-10</button>
   <button type="button" class="actie" data-waarde="reset">Reset</button>
</div>
