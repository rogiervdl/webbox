<div id="profiel-app">
   <h2>Profielkaart</h2>

   <label for="naam">Naam</label>
   <input type="text" id="naam" placeholder="Naam">

   <p>Kies een profieltype:</p>

   <div class="types">
      <button type="button" class="profieltype">Student</button>
      <button type="button" class="profieltype">Docent</button>
      <button type="button" class="profieltype">Bezoeker</button>
   </div>

   <button type="button" id="btn-toon">Toon profiel</button>
   <p id="melding"></p>

   <div class="profielkaart" id="kaart">
      <h3><span class="naam">&lt;naam&gt;</span> <span class="type"></span></h3>
      <p class="status">-</p>
   </div>
</div>
